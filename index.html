<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El cielo el día que te convertiste en mi persona favorita</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Cinzel:wght@400&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:#000; color:#fff; font-family:'Cormorant Garamond',serif; overflow:hidden; user-select:none; }
  canvas#bg { position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* LOCK */
  #lock-screen { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 1.2s ease,transform 1.2s ease; }
  #lock-screen.fade-out { opacity:0; transform:scale(1.05); pointer-events:none; }
  .subtitle-top { font-family:'Cinzel',serif; font-size:clamp(9px,1.5vw,12px); letter-spacing:0.4em; color:rgba(255,255,255,0.4); text-transform:uppercase; margin-bottom:48px; animation:fadeUp 1.4s ease forwards; opacity:0; }
  .lock-wrap { position:relative; width:120px; height:120px; display:flex; align-items:center; justify-content:center; animation:fadeUp 1.2s 0.2s ease forwards; opacity:0; }
  .lock-ring { position:absolute; inset:0; border-radius:50%; border:1px solid rgba(201,169,110,0.3); animation:ringPulse 3s ease-in-out infinite; }
  .lock-ring-2 { position:absolute; inset:10px; border-radius:50%; border:1px solid rgba(201,169,110,0.15); animation:ringPulse 3s 1s ease-in-out infinite; }
  @keyframes ringPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.06);opacity:0.5} }
  .lock-body { fill:none; stroke:#c9a96e; stroke-width:1.5; stroke-linejoin:round; }
  .lock-shackle { fill:none; stroke:#c9a96e; stroke-width:1.5; stroke-linecap:round; transition:transform 0.6s cubic-bezier(0.34,1.56,0.64,1),stroke 0.4s; transform-origin:50% 42%; }
  .lock-keyhole { fill:#c9a96e; opacity:0.9; }
  .lock-wrap.unlocking .lock-shackle { transform:rotate(-40deg) translateY(-6px); stroke:white; }
  .lock-wrap.unlocking .lock-body { stroke:white; }
  .input-group { margin-top:52px; display:flex; flex-direction:column; align-items:center; gap:16px; animation:fadeUp 1.2s 0.5s ease forwards; opacity:0; }
  .input-label { font-family:'Cinzel',serif; font-size:clamp(9px,1.4vw,11px); letter-spacing:0.35em; color:rgba(255,255,255,0.4); text-transform:uppercase; }
  .date-fields { display:flex; align-items:center; gap:10px; }
  .date-fields input[type="number"] { background:transparent; border:none; border-bottom:1px solid rgba(201,169,110,0.5); color:#fff; font-family:'Cinzel',serif; font-size:clamp(18px,3vw,26px); text-align:center; outline:none; transition:border-color 0.3s; -moz-appearance:textfield; }
  .date-fields input::-webkit-inner-spin-button, .date-fields input::-webkit-outer-spin-button { -webkit-appearance:none; }
  .date-fields input:focus { border-bottom-color:#c9a96e; }
  #inp-day{width:52px} #inp-month{width:42px} #inp-year{width:80px}
  .sep { color:#8a6d3b; font-family:'Cinzel',serif; font-size:20px; padding-bottom:2px; }
  .err-msg { font-size:11px; letter-spacing:0.2em; color:rgba(255,100,100,0.7); font-family:'Cinzel',serif; text-transform:uppercase; min-height:16px; opacity:0; transition:opacity 0.3s; }
  .err-msg.show { opacity:1; }
  .btn-unlock { margin-top:8px; background:transparent; border:1px solid rgba(201,169,110,0.5); color:#c9a96e; font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.45em; text-transform:uppercase; padding:14px 36px; cursor:pointer; transition:background 0.3s,color 0.3s,border-color 0.3s; position:relative; overflow:hidden; }
  .btn-unlock::before { content:''; position:absolute; inset:0; background:#c9a96e; transform:scaleX(0); transform-origin:left; transition:transform 0.4s ease; z-index:0; }
  .btn-unlock:hover::before { transform:scaleX(1); }
  .btn-unlock:hover { color:#000; border-color:#c9a96e; }
  .btn-unlock span { position:relative; z-index:1; }
  .hint { margin-top:40px; font-style:italic; font-size:clamp(12px,1.8vw,15px); color:rgba(255,255,255,0.2); animation:fadeUp 1.2s 0.9s ease forwards; opacity:0; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

  /* POSTER */
  #poster-screen { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 1.6s 0.6s ease; }
  #poster-screen.visible { opacity:1; pointer-events:auto; }
  .poster-wrap { position:relative; max-width:min(420px,88vw); width:100%; transform:scale(0.88) translateY(30px); transition:transform 1.8s 0.8s cubic-bezier(0.16,1,0.3,1); }
  #poster-screen.visible .poster-wrap { transform:scale(1) translateY(0); }
  .poster-wrap img { width:100%; display:block; border-radius:2px; box-shadow:0 0 80px rgba(201,169,110,0.15),0 0 200px rgba(0,0,0,0.8); }
  #cnv-heart { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; z-index:3; opacity:0; transition:opacity 1s 1.5s ease; }
  #poster-screen.visible #cnv-heart { opacity:1; }
  #star-hint { margin-top:14px; text-align:center; font-family:'Cinzel',serif; font-size:clamp(8px,1.2vw,10px); letter-spacing:0.35em; color:rgba(255,255,255,0.25); text-transform:uppercase; opacity:0; transition:opacity 1s 2.5s; }
  #poster-screen.visible #star-hint { opacity:1; }

  /* HEART PROGRESS */
  #progress { display:flex; justify-content:center; gap:10px; margin-top:12px; opacity:0; transition:opacity 1s 2.5s; }
  #poster-screen.visible #progress { opacity:1; }
  .pheart { font-size:18px; transition:all 0.4s ease; filter:grayscale(1); opacity:0.25; }
  .pheart.lit { filter:grayscale(0); opacity:1; transform:scale(1.3); animation:heartPop 0.5s ease; }
  @keyframes heartPop { 0%{transform:scale(1)} 50%{transform:scale(1.6)} 100%{transform:scale(1.3)} }

  /* NEBULA behind message */
  #nebula { position:fixed; inset:0; z-index:18; opacity:0; pointer-events:none; transition:opacity 2s ease; }
  #nebula.visible { opacity:1; }

  /* MESSAGE */
  #message { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; opacity:0; pointer-events:none; transition:opacity 2s ease; padding:40px; }
  #message.visible { pointer-events:auto; }
  #message.visible { opacity:1; }
  .msg-line { font-style:italic; font-size:clamp(17px,3.2vw,28px); font-weight:300; text-align:center; line-height:1.6; color:rgba(255,255,255,0); max-width:520px; }
  .msg-line.reveal { animation:fadeWord 1.2s ease forwards; }
  .msg-name { font-family:'Cinzel',serif; font-size:clamp(11px,1.6vw,14px); letter-spacing:0.5em; color:rgba(201,169,110,0); text-transform:uppercase; }
  .msg-deco { color:rgba(201,169,110,0); font-size:16px; letter-spacing:12px; }
  .msg-deco.reveal { animation:fadeWord 1.2s 0.4s ease forwards; }
  @keyframes fadeWord { from{color:rgba(255,255,255,0)} to{color:rgba(255,255,255,0.92)} }
  @keyframes fadeGold { from{color:rgba(201,169,110,0)} to{color:rgba(201,169,110,0.95)} }

  .btn-restart { margin-top:20px; background:none; border:none; color:rgba(255,255,255,0); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(12px,1.6vw,14px); letter-spacing:0.15em; cursor:pointer; opacity:0; transition:opacity 1s ease; padding:8px 0; }
  .btn-restart.show { opacity:1; color:rgba(255,255,255,0.3); }
  .btn-restart:hover { color:rgba(255,255,255,0.6); }

  #flash { position:fixed; inset:0; z-index:9; background:white; opacity:0; pointer-events:none; transition:opacity 0.15s; }
  #flash.active { opacity:0.6; }
  #wrong { position:fixed; inset:0; z-index:30; background:rgba(180,40,40,0.12); opacity:0; pointer-events:none; transition:opacity 0.15s; }
  #wrong.flash { opacity:1; }
  .heart-float { position:fixed; bottom:0; pointer-events:none; z-index:25; animation:floatH 4s ease forwards; }
  @keyframes decoTwinkle { 0%,100%{opacity:1;transform:scale(1)} 40%{opacity:0.4;transform:scale(0.7)} 70%{opacity:0.9;transform:scale(1.1)} }
  .msg-deco span { display:inline-block; }
  .msg-deco span:nth-child(1) { animation:decoTwinkle 2.1s 0s ease-in-out infinite; }
  .msg-deco span:nth-child(2) { animation:decoTwinkle 2.1s 0.7s ease-in-out infinite; }
  .msg-deco span:nth-child(3) { animation:decoTwinkle 2.1s 1.4s ease-in-out infinite; }
  @keyframes floatH { 0%{opacity:0;transform:translateY(0) scale(0.5)} 20%{opacity:0.8} 100%{opacity:0;transform:translateY(-70vh) scale(1.1)} }

  /* Star twinkle for lit stars */
  @keyframes starTwinkle { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.8)} }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="flash"></div>
<div id="wrong"></div>

<!-- NEBULA -->
<canvas id="nebula"></canvas>

<!-- LOCK -->
<div id="lock-screen">
  <div class="subtitle-top">Un momento guardado en el tiempo</div>
  <div class="lock-wrap" id="lockWrap">
    <div class="lock-ring"></div>
    <div class="lock-ring-2"></div>
    <svg width="60" height="70" viewBox="0 0 60 70">
      <path class="lock-shackle" d="M15 30 V18 A15 15 0 0 1 45 18 V30"/>
      <rect class="lock-body" x="8" y="29" width="44" height="32" rx="4"/>
      <circle class="lock-keyhole" cx="30" cy="43" r="5"/>
      <rect class="lock-keyhole" x="27.5" y="43" width="5" height="8" rx="1"/>
    </svg>
  </div>
  <div class="input-group">
    <div class="input-label">Ingresa la fecha especial</div>
    <div class="date-fields">
      <input type="number" id="inp-day"   placeholder="05" min="1" max="31">
      <span class="sep">/</span>
      <input type="number" id="inp-month" placeholder="11" min="1" max="12">
      <span class="sep">/</span>
      <input type="number" id="inp-year"  placeholder="2003" min="2000" max="2099">
    </div>
    <div class="err-msg" id="errMsg">Fecha incorrecta</div>
    <button class="btn-unlock" onclick="tryUnlock()"><span>Desbloquear</span></button>
  </div>
  <div class="hint">Solo tú sabes la fecha</div>
</div>

<script>
// ── Audio ─────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq, dur, vol=0.18, type='sine', delay=0) {
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = type; o.frequency.value = freq;
  const t = AC.currentTime + delay;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}

function playStarClick() {
  // Soft bell chime
  playNote(1046, 0.8, 0.12, 'sine');
  playNote(1318, 0.6, 0.07, 'sine', 0.04);
  playNote(1568, 0.5, 0.05, 'sine', 0.09);
}

function playComplete() {
  // Ascending arpeggio then chord
  const notes = [523, 659, 784, 1046, 1318];
  notes.forEach((f, i) => playNote(f, 1.2, 0.1, 'sine', i * 0.12));
  setTimeout(() => {
    [523, 659, 784, 1046].forEach(f => playNote(f, 2.5, 0.07, 'sine'));
  }, notes.length * 120 + 100);
}

function resumeAudio() { if(AC.state==='suspended') AC.resume(); }
document.addEventListener('click', resumeAudio, {once:true});

// ── BG particles ──────────────────────────────
const bgC = document.getElementById('bg');
const bgCtx = bgC.getContext('2d');
let bgW, bgH, bgS = [];
function resizeBg() {
  bgW = bgC.width = window.innerWidth;
  bgH = bgC.height = window.innerHeight;
  bgS = Array.from({length: Math.floor(bgW*bgH/3500)}, ()=>({
    x:Math.random()*bgW, y:Math.random()*bgH,
    r:Math.random()*1.1+0.15, op:Math.random()*0.5+0.08,
    sp:Math.random()*0.001+0.0005, ph:Math.random()*Math.PI*2
  }));
}
resizeBg();
window.addEventListener('resize', resizeBg);
(function animBg(t){
  bgCtx.clearRect(0,0,bgW,bgH);
  for(const s of bgS){
    bgCtx.globalAlpha = s.op*(0.4+0.6*(Math.sin(t*s.sp+s.ph)+1)/2);
    bgCtx.fillStyle='#fff';
    bgCtx.beginPath(); bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2); bgCtx.fill();
  }
  requestAnimationFrame(animBg);
})(0);

// ── Nebula ────────────────────────────────────
function drawNebula() {
  const nc = document.getElementById('nebula');
  nc.width = window.innerWidth; nc.height = window.innerHeight;
  const nCtx = nc.getContext('2d');
  const cx = nc.width/2, cy = nc.height/2;
  const g1 = nCtx.createRadialGradient(cx, cy, 0, cx, cy, nc.width*0.55);
  g1.addColorStop(0, 'rgba(80,40,120,0.35)');
  g1.addColorStop(0.4, 'rgba(40,20,80,0.2)');
  g1.addColorStop(0.7, 'rgba(180,130,60,0.08)');
  g1.addColorStop(1, 'rgba(0,0,0,0)');
  nCtx.fillStyle = g1;
  nCtx.fillRect(0,0,nc.width,nc.height);
}
drawNebula();

// ── Lock ──────────────────────────────────────
function tryUnlock(){
  resumeAudio();
  const d=parseInt(document.getElementById('inp-day').value);
  const m=parseInt(document.getElementById('inp-month').value);
  const y=parseInt(document.getElementById('inp-year').value);
  const err=document.getElementById('errMsg');
  if(d===25&&m===8&&y===2010){ err.classList.remove('show'); doUnlock(); }
  else {
    err.classList.add('show');
    playNote(200, 0.4, 0.1, 'sawtooth');
    document.getElementById('lockWrap').animate(
      [{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}],
      {duration:400,easing:'ease'}
    );
    setTimeout(()=>err.classList.remove('show'),2500);
  }
}
document.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
document.getElementById('inp-day').addEventListener('input',function(){ if(this.value.length>=2) document.getElementById('inp-month').focus(); });
document.getElementById('inp-month').addEventListener('input',function(){ if(this.value.length>=2) document.getElementById('inp-year').focus(); });

function doUnlock(){
  document.getElementById('lockWrap').classList.add('unlocking');
  playNote(880, 0.6, 0.12, 'sine');
  setTimeout(()=>{ playNote(1108, 0.6, 0.1, 'sine'); }, 150);
  setTimeout(()=>{
    const f=document.getElementById('flash');
    f.classList.add('active');
    setTimeout(()=>f.classList.remove('active'),300);
  },600);
  setTimeout(()=>document.getElementById('lock-screen').classList.add('fade-out'),700);
  setTimeout(()=>{
    document.getElementById('poster-screen').classList.add('visible');
    initConstellation();
    buildProgress();
  },1400);
}

// ── Constellation ─────────────────────────────
const cnv = document.getElementById('cnv-heart');
const ctx = cnv.getContext('2d');

const HEART_NORM = [
  [0.50, 0.72],
  [0.66, 0.57],
  [0.80, 0.43],
  [0.78, 0.27],
  [0.63, 0.17],
  [0.50, 0.30],
  [0.37, 0.17],
  [0.22, 0.27],
  [0.20, 0.43],
  [0.34, 0.57],
];

const TOTAL = HEART_NORM.length;
let stars=[], noiseStars=[], nextIdx=0, completed=false, raf2;
let CW=0, CH=0;

function initConstellation(){
  const img = document.getElementById('posterImg');
  const pw = img.offsetWidth, ph = img.offsetHeight;
  cnv.width = pw; cnv.height = ph;
  CW = pw; CH = ph;

  stars = HEART_NORM.map(([nx,ny])=>({
    x: nx*CW + (Math.random()-0.5)*CW*0.018,
    y: ny*CH + (Math.random()-0.5)*CH*0.018,
    r: Math.max(2.5, CW*0.007),
    lit: false,
    twinklePhase: Math.random()*Math.PI*2,
    twinkleSpeed: 0.002 + Math.random()*0.002,
    litTime: 0,
    rays: Array.from({length:6}, (_,i)=>({ angle: i*Math.PI/3 + Math.random()*0.3, len: 0.6+Math.random()*0.6 }))
  }));

  noiseStars = Array.from({length:55},()=>({
    x: CW*0.08 + Math.random()*CW*0.84,
    y: CH*0.04 + Math.random()*CH*0.74,
    r: Math.max(0.8, CW*0.002)+Math.random()*Math.max(1,CW*0.003),
    op: 0.15+Math.random()*0.3,
    ph: Math.random()*Math.PI*2,
    sp: 0.0005+Math.random()*0.001
  }));

  nextIdx=0; completed=false;
  cancelAnimationFrame(raf2);
  drawLoop(performance.now());

  // First star hint: pulse brighter for 3s
  setTimeout(()=>{ if(stars[0]) stars[0].hintActive = false; }, 3000);
  if(stars[0]) stars[0].hintActive = true;
}

window.addEventListener('resize',()=>{
  if(document.getElementById('poster-screen').classList.contains('visible')) initConstellation();
});

function buildProgress(){
  const prog=document.getElementById('progress');
  prog.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('span');
    d.className='pheart'; d.id='ph'+i;
    d.textContent = '♡';
    prog.appendChild(d);
  }
}

// Draw a 4-point star shape
function drawStarShape(x, y, r, spikes, ctx){
  const inner = r * 0.4;
  ctx.beginPath();
  for(let i=0; i<spikes*2; i++){
    const angle = (i * Math.PI / spikes) - Math.PI/2;
    const rad = i%2===0 ? r : inner;
    const px = x + Math.cos(angle)*rad;
    const py = y + Math.sin(angle)*rad;
    i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function drawLoop(t){
  if(completed) return;
  raf2=requestAnimationFrame(drawLoop);
  ctx.clearRect(0,0,CW,CH);

  // Noise stars — twinkling
  for(const s of noiseStars){
    const pulse = (Math.sin(t*s.sp+s.ph)+1)/2;
    ctx.globalAlpha = s.op*(0.5+0.5*pulse);
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*(0.8+0.2*pulse),0,Math.PI*2); ctx.fill();
  }

  // Lines between lit stars
  for(let i=0;i<nextIdx-1;i++){
    const a=stars[i],b=stars[i+1];
    ctx.globalAlpha=0.55; ctx.strokeStyle='#c9a96e'; ctx.lineWidth=Math.max(1,CW*0.002);
    ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  if(nextIdx===TOTAL){
    ctx.globalAlpha=0.55; ctx.strokeStyle='#c9a96e';
    ctx.beginPath(); ctx.moveTo(stars[TOTAL-1].x,stars[TOTAL-1].y); ctx.lineTo(stars[0].x,stars[0].y); ctx.stroke();
  }

  // Heart stars
  for(let i=0;i<TOTAL;i++){
    const s=stars[i];
    const pulse=(Math.sin(t*s.twinkleSpeed+s.twinklePhase)+1)/2;

    if(s.lit){
      // Time since lit for twinkling
      const age = (t - s.litTime) / 1000;
      const twinkle = 0.7 + 0.3*Math.sin(t*0.004+s.twinklePhase);

      // Outer glow
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*9);
      g.addColorStop(0,'rgba(255,230,140,0.7)');
      g.addColorStop(0.3,'rgba(201,169,110,0.4)');
      g.addColorStop(1,'rgba(201,169,110,0)');
      ctx.globalAlpha=0.4*twinkle; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*9,0,Math.PI*2); ctx.fill();

      // 4-point star shape
      const starR = s.r*(1.8+0.4*twinkle);
      ctx.globalAlpha=0.95*twinkle;
      ctx.fillStyle='#fffbe8';
      drawStarShape(s.x, s.y, starR, 4, ctx);
      ctx.fill();

      // Bright core
      ctx.globalAlpha=1;
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*0.5,0,Math.PI*2); ctx.fill();

      // Rays
      ctx.strokeStyle='rgba(255,240,180,0.5)';
      ctx.lineWidth=0.8;
      for(const ray of s.rays){
        const rayLen = s.r*(3+ray.len)*twinkle;
        ctx.globalAlpha=0.3*twinkle;
        ctx.beginPath();
        ctx.moveTo(s.x+Math.cos(ray.angle)*s.r*0.6, s.y+Math.sin(ray.angle)*s.r*0.6);
        ctx.lineTo(s.x+Math.cos(ray.angle)*rayLen, s.y+Math.sin(ray.angle)*rayLen);
        ctx.stroke();
      }

    } else if(i===nextIdx){
      // Next star — hint ring + slightly brighter
      const isHinting = s.hintActive;
      const hintPulse = isHinting ? (Math.sin(t*0.005)+1)/2 : (Math.sin(t*0.003)+1)/2;

      // Hint ring
      ctx.globalAlpha=0.05+hintPulse*0.05;
      ctx.strokeStyle='#c9a96e'; ctx.lineWidth=0.6; ctx.setLineDash([2,6]);
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*(4+hintPulse*2),0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);

      // Star itself
      ctx.globalAlpha = isHinting ? 0.45+hintPulse*0.2 : 0.30+pulse*0.15;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*0.9,0,Math.PI*2); ctx.fill();

    } else {
      // Unlit, not next
      ctx.globalAlpha=0.3+pulse*0.1; ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*0.75,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

const HIT_R_RATIO = 0.065;
cnv.addEventListener('click',e=>{
  if(completed) return;
  resumeAudio();
  const rect=cnv.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(CW/rect.width);
  const my=(e.clientY-rect.top)*(CH/rect.height);
  const HIT=CW*HIT_R_RATIO;
  if(nextIdx>=TOTAL) return;
  const target=stars[nextIdx];
  if(Math.hypot(mx-target.x,my-target.y)<=HIT){
    target.lit=true;
    target.litTime=performance.now();
    nextIdx++;
    // Heart progress
    const ph=document.getElementById('ph'+(nextIdx-1));
    if(ph){ ph.classList.add('lit'); ph.textContent='♥'; }
    playStarClick();
    if(nextIdx===TOTAL) setTimeout(showMessage,900);
  } else {
    for(let i=nextIdx+1;i<TOTAL;i++){
      if(Math.hypot(mx-stars[i].x,my-stars[i].y)<=HIT){
        const w=document.getElementById('wrong');
        w.classList.add('flash'); setTimeout(()=>w.classList.remove('flash'),300);
        playNote(200, 0.3, 0.1, 'sawtooth');
        break;
      }
    }
  }
});

function showMessage(){
  cancelAnimationFrame(raf2); completed=true;
  playComplete();

  // Final static draw
  ctx.clearRect(0,0,CW,CH);
  for(const s of noiseStars){
    ctx.globalAlpha=s.op*0.2; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=0.4; ctx.strokeStyle='#c9a96e'; ctx.lineWidth=Math.max(1,CW*0.002);
  for(let i=0;i<TOTAL-1;i++){
    ctx.beginPath(); ctx.moveTo(stars[i].x,stars[i].y); ctx.lineTo(stars[i+1].x,stars[i+1].y); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(stars[TOTAL-1].x,stars[TOTAL-1].y); ctx.lineTo(stars[0].x,stars[0].y); ctx.stroke();
  for(const s of stars){
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*8);
    g.addColorStop(0,'rgba(255,240,160,0.7)'); g.addColorStop(1,'rgba(201,169,110,0)');
    ctx.globalAlpha=0.4; ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*8,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.9; ctx.fillStyle='#fffbe8';
    drawStarShape(s.x, s.y, s.r*2, 4, ctx); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*0.5,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  document.getElementById('star-hint').style.opacity='0';
  document.getElementById('progress').style.opacity='0';

  // Show nebula
  document.getElementById('nebula').classList.add('visible');

  document.getElementById('poster-screen').style.transition='opacity 2s ease';
  setTimeout(()=>{
    document.getElementById('poster-screen').style.opacity='0.12';
    const msg=document.getElementById('message');
    msg.classList.add('visible');
    setTimeout(()=>document.getElementById('deco').classList.add('reveal'),400);
    setTimeout(()=>document.getElementById('msg1').classList.add('reveal'),900);
    setTimeout(()=>document.getElementById('msg2').classList.add('reveal'),1600);
    setTimeout(()=>document.getElementById('msg2b').classList.add('reveal'),2300);
    setTimeout(()=>{
      const n=document.getElementById('msgName');
      n.style.animation='fadeGold 1.2s ease forwards';
      n.classList.add('reveal');
    },3100);
    setTimeout(()=>document.getElementById('btnRestart').classList.add('show'),5500);
    spawnHearts();
  },800);
}

function spawnHearts(){
  const sym=['♡','✦','✧','⋆'];
  for(let i=0;i<22;i++){
    setTimeout(()=>{
      const h=document.createElement('div');
      h.className='heart-float';
      h.style.cssText=`left:${Math.random()*100}vw;font-size:${10+Math.random()*12}px;color:rgba(201,169,110,${0.25+Math.random()*0.4})`;
      h.textContent=sym[Math.floor(Math.random()*sym.length)];
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),4500);
    },i*200);
  }
}

function restartAll(){
  // Reset message
  const msg=document.getElementById('message');
  msg.classList.remove('visible');
  ['deco','msg1','msg2','msg2b','msgName'].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.remove('reveal');
    el.style.animation='none';
    void el.offsetWidth;
    el.style.animation='';
  });
  document.getElementById('btnRestart').classList.remove('show');
  document.getElementById('nebula').classList.remove('visible');

  // Reset constellation state
  nextIdx=0; completed=false;
  cancelAnimationFrame(raf2);
  if(stars.length) stars.forEach(s=>{ s.lit=false; s.litTime=0; });
  document.querySelectorAll('.pheart').forEach(d=>{ d.classList.remove('lit'); d.textContent='♡'; });

  // Restore poster to full opacity and restart constellation
  const ps=document.getElementById('poster-screen');
  ps.style.transition='opacity 1s ease';
  ps.style.opacity='1';
  document.getElementById('star-hint').style.opacity='1';
  document.getElementById('progress').style.opacity='1';

  initConstellation();
  drawLoop(performance.now());
}
</script>
